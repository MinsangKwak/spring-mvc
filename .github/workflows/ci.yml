name: Verify MVC lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvc-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew --no-daemon clean build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check UI contract
        run: |
          npm ci --ignore-scripts
          npm run check:ui
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify browser flow
        shell: bash
        run: |
          java -jar build/libs/spring-mvc-1.0.0-SNAPSHOT.jar > build/server.log 2>&1 &
          lab_server_pid=$!
          trap 'kill "$lab_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          npm run test:browser
      - name: Verify deployment container
        shell: bash
        run: |
          docker build -t spring-mvc-lab .
          docker run -d --name mvc-render-check --memory=512m -p 10000:10000 -e PORT=10000 spring-mvc-lab
          trap 'docker logs mvc-render-check > build/container.log 2>&1; docker rm -f mvc-render-check >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            curl -sf http://127.0.0.1:10000/api/hello >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:10000/api/hello
          curl -fsS http://127.0.0.1:10000/swagger-ui/index.html >/dev/null
          curl -fsS http://127.0.0.1:10000/hello/request/form/json -H 'Content-Type: application/json' -d '{"name":"Demo","age":33}' > build/container-response.json
          node -e "const d=require('./build/container-response.json');if(d.name!=='Demo'||d.age!==33)process.exit(1)"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvc-lab-verification
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/browser-screenshots/
            build/server.log
            build/container.log
          retention-days: 14
