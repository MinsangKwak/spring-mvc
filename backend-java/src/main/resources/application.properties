spring.application.name=spring-mvc-lab
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-parameter-count=32
server.tomcat.max-swallow-size=64KB
spring.servlet.multipart.enabled=false
springdoc.swagger-ui.path=/_swagger
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.query-config-enabled=false
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.default-models-expand-depth=-1
springdoc.paths-to-match=/api/**,/hello/request/**,/response/**
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-response=true
